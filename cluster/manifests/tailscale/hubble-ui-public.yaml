apiVersion: v1
kind: Service
metadata:
  name: hubble-ui-public
  namespace: kube-system
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/hostname: 'hubble'
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    k8s-app: hubble-ui
  ports:
    - port: 80
      targetPort: 8081
