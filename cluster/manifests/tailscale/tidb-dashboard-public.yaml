apiVersion: v1
kind: Service
metadata:
  name: tidb-dashboard-public
  namespace: tidb-cluster
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/hostname: 'tidb-dashboard'
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/component: pd
    app.kubernetes.io/instance: basic
  ports:
    - port: 2379
      targetPort: 2379
