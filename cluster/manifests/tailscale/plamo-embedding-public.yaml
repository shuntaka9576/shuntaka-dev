apiVersion: v1
kind: Service
metadata:
  name: plamo-embedding-public
  namespace: plamo-embedding
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/hostname: 'plamo-embedding'
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: plamo-embedding
  ports:
    - name: http
      port: 80
      targetPort: 8080
