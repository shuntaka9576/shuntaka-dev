apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: dashboard-cluster-nodes
    files:
      - cluster-nodes.json
  - name: dashboard-cluster-pods
    files:
      - cluster-pods.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: '1'
