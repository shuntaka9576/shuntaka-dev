[workspace]
resolver = "3"
members = [
  "apps/blog-api",
  "apps/blog-api/api",
  "apps/blog-api/kernel",
  "apps/blog-api/adapter",
  "apps/blog-api/shared",
  "apps/blog-api/registry",
  "apps/blog-api/markdown",
  "apps/blog-api/infrastructure",
]

[workspace.dependencies]
adapter = { path = "./apps/blog-api/adapter" }
api = { path = "./apps/blog-api/api" }
kernel = { path = "./apps/blog-api/kernel" }
shared = { path = "./apps/blog-api/shared" }
registry = { path = "./apps/blog-api/registry" }
markdown = { path = "./apps/blog-api/markdown" }
infrastructure = { path = "./apps/blog-api/infrastructure" }
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["macros"] }
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "uuid",
  "chrono",
  "macros",
  "mysql",
  "migrate",
] }
tokio = { version = "1.52.3", features = ["full"] }
async-trait = "0.1.89"
derive-new = "0.7.0"
rstest = "0.26.1"
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
aws-config = "1.9.0"
aws-sdk-ssm = "1.115.0"
tower-http = { version = "0.7.0", features = ["cors", "trace", "compression-gzip"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
base64 = "0.22.1"
regex = "1.12.4"
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
urlencoding = "2.1.3"
futures = "0.3.32"
thiserror = "2.0.18"
tracing = "0.1.44"
hex = "0.4.3"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
opentelemetry-aws = { version = "0.20.0", default-features = false, features = ["trace"] }
tracing-opentelemetry = "0.33.0"
