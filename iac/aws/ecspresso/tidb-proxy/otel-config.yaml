# ADOT Collector sidecar 設定。
#
# ecs-task-def.jsonnet が importstr でこのファイルを AOT_CONFIG_CONTENT 環境変数に
# 埋め込む (SSM 経由にしない: 設定は秘匿情報ではなく、task def と一緒に版管理したい)。
#
# 受信: Lambda (blog-api) から VPC 越しに http://tidb-proxy.internal:4318 (OTLP/HTTP)、
#       同一 task 内の forwarder から http://localhost:4317 (OTLP/gRPC)。
# 送信: traces -> X-Ray / metrics -> CloudWatch EMF (namespace: BlogRuntime)。
extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  awsxray:
    region: ap-northeast-1
    # X-Ray コンソールでフィルタ検索できるように annotation 化する属性
    indexed_attributes:
      - app.route
      - cold_start
      - db.query_type
      - db.statement_hash
      - proxy.close.reason
      - error.type
      - peer.service
      - external.operation
  awsemf:
    region: ap-northeast-1
    namespace: BlogRuntime
    log_group_name: /aws/otel/blog-runtime
    # metric_declarations で dimension セットを固定するため rollup は不要
    dimension_rollup_option: NoDimensionRollup
    resource_to_telemetry_conversion:
      enabled: true
    # CloudWatch dashboard (iac/aws/lib/api/observability-construct.ts) が参照する
    # dimension セットと一致させること
    metric_declarations:
      - dimensions: [[service.name], [service.name, app.route]]
        metric_name_selectors:
          - "^app\\.request\\.duration$"
      - dimensions: [[service.name], [service.name, db.query_type]]
        metric_name_selectors:
          - "^db\\.query\\.duration$"
          - "^db\\.query\\.error\\.count$"
      - dimensions: [[service.name]]
        metric_name_selectors:
          - "^db\\.healthcheck\\.duration$"
          - "^db\\.connection\\.duration$"
          - "^lambda\\.cold_start\\.count$"
      - dimensions: [[service.name], [service.name, error.type]]
        metric_name_selectors:
          - "^proxy\\.error\\.count$"
      - dimensions: [[service.name]]
        metric_name_selectors:
          - "^proxy\\.connection\\.active$"
          - "^proxy\\.connection\\.accept\\.count$"
          - "^proxy\\.connection\\.duration$"
          - "^proxy\\.upstream\\.connect\\.duration$"
          - "^proxy\\.bytes\\.(in|out)$"
          - "^proxy\\.timeout\\.count$"

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]
