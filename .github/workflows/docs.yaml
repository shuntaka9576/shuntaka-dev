name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - preview
    paths:
      - 'docs/**'
      - 'apps/web/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup Python
        working-directory: docs
        run: uv python install

      - name: Install Sphinx dependencies
        working-directory: docs
        run: uv sync

      - name: Build Sphinx documentation
        working-directory: docs
        run: uv run sphinx-build source build

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Build Storybook into docs/build/storybook/
        env:
          STORYBOOK_BASE_PATH: /shuntaka-dev/storybook/
        run: |
          bun --filter @shuntaka-dev/web build-storybook
          mkdir -p docs/build/storybook
          cp -r apps/web/storybook-static/. docs/build/storybook/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
