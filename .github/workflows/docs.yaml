name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - preview
    paths:
      - 'docs/**'
      - 'apps/web/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout でリポジトリを取得するため
      pages: write # actions/configure-pages で Pages 設定を取得するため
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Setup Python
        working-directory: docs
        run: uv python install

      - name: Install Sphinx dependencies
        working-directory: docs
        run: uv sync

      - name: Build Sphinx documentation
        working-directory: docs
        run: uv run sphinx-build source build

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Build Storybook into docs/build/storybook/
        env:
          STORYBOOK_BASE_PATH: /shuntaka-dev/storybook/
        run: |
          bun --filter @shuntaka-dev/web build-storybook
          mkdir -p docs/build/storybook
          cp -r apps/web/storybook-static/. docs/build/storybook/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # actions/deploy-pages で Pages にデプロイするため
      id-token: write # GitHub Pages の OIDC 認証のため
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
