name: Renovate APM Update

on:
  pull_request:
    paths:
      - 'apm.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-and-audit:
    name: Update apm.lock.yaml
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    env:
      APM_VERSION: 0.13.0
      APM_SHA256: ed02b1103ef4bc49559a81f7e109b424a49d95cf978515ad224e5eeb701b1f8a
    steps:
      # GITHUB_TOKEN で push すると後続ワークフローがトリガーされない仕様を回避するため、
      # GitHub App トークンを発行してそれで push する
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SHUNTAKA_DEV_UTILS_APP_ID }}
          private-key: ${{ secrets.SHUNTAKA_DEV_UTILS_PRIVATE_KEY }}
          repositories: |
            shuntaka-dev
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install APM
        run: |
          set -euo pipefail
          curl -sL "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/apm-linux-x86_64.tar.gz" -o apm.tar.gz
          echo "${APM_SHA256}  apm.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.apm"
          tar xzf apm.tar.gz -C "${HOME}/.apm" --strip-components=1
          rm apm.tar.gz
          echo "${HOME}/.apm" >> "${GITHUB_PATH}"

      # Renovate が apm.yml の ref を bump しても apm install は lockfile の
      # resolved_commit を優先して fetch するため、ref と commit が乖離した状態
      # で lockfile が更新されることがある。lockfile を消してから install する
      # ことで、新 ref で必ず resolve し直し、新 ref に存在しないパスは fail
      # させる
      - name: apm install (force re-resolve)
        run: |
          rm -f apm.lock.yaml
          apm install -t claude

      - name: apm audit (lockfile + drift + content scan)
        run: apm audit --ci

      - name: Commit apm.lock.yaml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apm.lock.yaml
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: sync apm.lock.yaml"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
