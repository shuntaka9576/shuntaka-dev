name: Deploy (Reusable)

on:
  workflow_call:
    inputs:
      stageName:
        required: true
        type: string
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      GH_APP_ID:
        required: true
      CLOUDINARY_CLOUD_NAME:
        required: true
      CLOUDINARY_API_KEY:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy CDK
    # Apple Silicon ビルド用 self-hosted runner。呼び出し元のトリガ制限で pull_request 由来では起動しない。
    runs-on: [self-hosted, macOS, ARM64] # zizmor: ignore[self-hosted-runner]
    timeout-minutes: 30
    environment: ${{ inputs.stageName }}
    permissions:
      id-token: write # AWS IAM Role に OIDC AssumeRole するため
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.stageName }}-shuntaka-assume-role
          aws-region: ap-northeast-1

      - name: CDK Deploy
        working-directory: iac/aws
        run: |
          case "$STAGE_NAME" in
            prd) PREFIX=p ;;
            *)   PREFIX=d ;;
          esac
          bunx cdk deploy "${PREFIX}-st-main" -c "stageName=${STAGE_NAME}" --require-approval never
        env:
          STAGE_NAME: ${{ inputs.stageName }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SECRET_PEM_KEY_NAME: ${{ vars.GH_APP_SECRET_PEM_KEY_NAME }}
          GH_WEBHOOK_SECRET_KEY_NAME: ${{ vars.GH_WEBHOOK_SECRET_KEY_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET_KEY_NAME: ${{ vars.CLOUDINARY_API_SECRET_KEY_NAME }}
