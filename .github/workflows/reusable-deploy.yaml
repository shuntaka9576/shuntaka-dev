name: Deploy (Reusable)

on:
  workflow_call:
    inputs:
      stageName:
        required: true
        type: string
      # デプロイ対象スタック: all | st-tidb-proxy | st-tidb-proxy-logs | main | admin
      stack:
        required: false
        type: string
        default: 'all'
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      GH_APP_ID:
        required: true
      CLOUDINARY_CLOUD_NAME:
        required: true
      CLOUDINARY_API_KEY:
        required: true

permissions: {}

jobs:
  deploy:
    name: Deploy CDK
    # Apple Silicon ビルド用 self-hosted runner。呼び出し元のトリガ制限で pull_request 由来では起動しない。
    runs-on: [self-hosted, macOS, ARM64] # zizmor: ignore[self-hosted-runner]
    # main は cargo zigbuild + Docker build + next build を含み、初回は CloudFront の作成も待つ
    timeout-minutes: 60
    environment: ${{ inputs.stageName }}
    permissions:
      id-token: write # AWS IAM Role に OIDC AssumeRole するため
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-node

      - name: Setup Rust
        uses: $/.github/actions/setup-rust

      # blog-api の Web Function 用に aarch64 musl の静的バイナリを作る (iac/aws/lib/web-function-package.ts)。
      # self-hosted runner なので一度入れれば次回以降は再利用される。rustup show は既に入っている
      # toolchain に rust-toolchain.toml の targets を足さないため、musl の target は明示的に入れる
      - name: Setup cargo-zigbuild
        run: |
          rustup target add aarch64-unknown-linux-musl
          command -v zig >/dev/null || brew install zig
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ inputs.stageName }}-shuntaka-assume-role
          aws-region: ap-northeast-1

      # main 以外のステップは --exclusively で依存スタックをデプロイせず、bundling も対象スタックに
      # 限る (付けないと全スタックが bundling され、main の cargo zigbuild / next build まで走る)。
      #
      # dev / prd 共用の shared stack。Lambda VPC 化 (タスク 4 以降) で main-stack が
      # st-tidb-proxy の SSM 出力に依存するため、main より先にデプロイする。
      - name: CDK Deploy (st-tidb-proxy)
        if: inputs.stack == 'all' || inputs.stack == 'st-tidb-proxy'
        working-directory: iac/aws
        run: |
          bunx cdk deploy st-tidb-proxy --exclusively -c "stageName=${STAGE_NAME}" --require-approval never
        env:
          STAGE_NAME: ${{ inputs.stageName }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SECRET_PEM_KEY_NAME: ${{ vars.GH_APP_SECRET_PEM_KEY_NAME }}
          GH_WEBHOOK_SECRET_KEY_NAME: ${{ vars.GH_WEBHOOK_SECRET_KEY_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET_KEY_NAME: ${{ vars.CLOUDINARY_API_SECRET_KEY_NAME }}

      # dev / prd 共用の shared stack (tidb-proxy のログ分析基盤)。
      # 依存の向き: st-tidb-proxy (SSM 出力) → 本スタック → deploy-tidb-proxy.yaml。
      # 本スタックが作る SSM (/tidb-proxy/logs/...) を ecspresso が task def の
      # render 時に参照するため、log-router 入り task def のデプロイより先に本
      # スタックを適用しておく必要がある (逆依存は無い。task 稼働中でなくてよい)。
      # FireLens 設定 (apps/tidb-proxy/firelens/) の S3 同期もここで行われる
      # (稼働中 task への反映は force-new-deployment が別途必要)。
      - name: CDK Deploy (st-tidb-proxy-logs)
        if: inputs.stack == 'all' || inputs.stack == 'st-tidb-proxy-logs'
        working-directory: iac/aws
        run: |
          bunx cdk deploy st-tidb-proxy-logs --exclusively -c "stageName=${STAGE_NAME}" --require-approval never
        env:
          STAGE_NAME: ${{ inputs.stageName }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SECRET_PEM_KEY_NAME: ${{ vars.GH_APP_SECRET_PEM_KEY_NAME }}
          GH_WEBHOOK_SECRET_KEY_NAME: ${{ vars.GH_WEBHOOK_SECRET_KEY_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET_KEY_NAME: ${{ vars.CLOUDINARY_API_SECRET_KEY_NAME }}

      # blog-api (Web Function + Event Function) と公開サイト (CloudFront + apps/web の Web Function)。
      # synth 時に cargo zigbuild と next build が走る。us-east-1 の証明書スタックは依存として先にデプロイされる
      - name: CDK Deploy (main)
        if: inputs.stack == 'all' || inputs.stack == 'main'
        working-directory: iac/aws
        run: |
          case "$STAGE_NAME" in
            prd) PREFIX=p ;;
            *)   PREFIX=d ;;
          esac
          bunx cdk deploy "${PREFIX}-st-main" -c "stageName=${STAGE_NAME}" --require-approval never
        env:
          STAGE_NAME: ${{ inputs.stageName }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SECRET_PEM_KEY_NAME: ${{ vars.GH_APP_SECRET_PEM_KEY_NAME }}
          GH_WEBHOOK_SECRET_KEY_NAME: ${{ vars.GH_WEBHOOK_SECRET_KEY_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET_KEY_NAME: ${{ vars.CLOUDINARY_API_SECRET_KEY_NAME }}
          # apps/web の next build に焼き込む公開 ID (GitHub Environments の Environment variable)
          NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          # next build 時の API の向き先。apex を CloudFront へ切り替える初回だけ旧 API を指す
          WEB_BUILD_API_URL: ${{ vars.WEB_BUILD_API_URL }}

      # moments 管理画面 (Cognito + Lambda + CloudFront)。us-east-1 の証明書スタック →
      # admin-web ビルド (Cognito 出力の SSM を参照。初回デプロイ時は空でビルドされるため、
      # スタック適用後にもう一度 admin を deploy すると SPA に実値が焼き込まれる) → admin の順。
      - name: CDK Deploy (admin)
        if: inputs.stack == 'all' || inputs.stack == 'admin'
        working-directory: iac/aws
        run: |
          case "$STAGE_NAME" in
            prd) PREFIX=p ;;
            *)   PREFIX=d ;;
          esac
          bunx cdk deploy "${PREFIX}-st-virginia-cert" --exclusively -c "stageName=${STAGE_NAME}" --require-approval never
          POOL_ID=$(aws ssm get-parameter --name "/${STAGE_NAME}/shuntaka/admin/user-pool-id" --query 'Parameter.Value' --output text 2>/dev/null || echo '')
          CLIENT_ID=$(aws ssm get-parameter --name "/${STAGE_NAME}/shuntaka/admin/user-pool-client-id" --query 'Parameter.Value' --output text 2>/dev/null || echo '')
          (
            cd ../../apps/admin-web
            VITE_COGNITO_USER_POOL_ID="$POOL_ID" \
              VITE_COGNITO_CLIENT_ID="$CLIENT_ID" \
              VITE_IMAGES_BASE_URL="https://images.${SITE_FQDN}" \
              VITE_PREVIEW_BASE_URL="https://${SITE_FQDN}" \
              bun run build
          )
          # labs-web (SvelteKit adapter-static)。/labs 配下のマイクロフロントエンド。
          # ビルド成果物が無い場合 admin stack 側は warning でスキップするため必ずここで作る
          (
            cd ../../apps/labs-web
            bun run build
          )
          bunx cdk deploy "${PREFIX}-st-admin" --exclusively -c "stageName=${STAGE_NAME}" --require-approval never
        env:
          STAGE_NAME: ${{ inputs.stageName }}
          # 公開サイトの apex ドメイン。GitHub Environments (dev / prd) の
          # Environment variable。dev: shuntaka.me / prd: shuntaka.dev
          SITE_FQDN: ${{ vars.SITE_FQDN }}
          # admin stack が main stack (blog-api Lambda ロール ARN) に依存するため、
          # synth 時に main stack の env 未設定エラー注釈が出ないよう他ステップと同じ env を渡す
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SECRET_PEM_KEY_NAME: ${{ vars.GH_APP_SECRET_PEM_KEY_NAME }}
          GH_WEBHOOK_SECRET_KEY_NAME: ${{ vars.GH_WEBHOOK_SECRET_KEY_NAME }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET_KEY_NAME: ${{ vars.CLOUDINARY_API_SECRET_KEY_NAME }}
