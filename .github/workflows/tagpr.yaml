name: tagpr

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    name: tagpr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # CalVer タグの push と GitHub Release 作成のため
      pull-requests: write # リリース PR の作成・更新のため
      issues: read # リリース PR のラベル参照のため
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run tagpr
        id: tagpr
        uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GITHUB_TOKEN が打ったタグでは on: push: tags の別ワークフローが起動しないため、
  # 本番デプロイはタグ作成と同一ワークフローの後続ジョブとして実行する。
  # 公開サイト (apps/web) も main stack の CloudFront + Web Function に含まれる
  deploy-prd:
    name: Deploy prd (CDK)
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      id-token: write # AWS IAM Role に OIDC AssumeRole するため reusable workflow に継承
      contents: read
    concurrency:
      group: deploy-prd # deploy.yaml の手動 dispatch (prd) と排他
      cancel-in-progress: false
    uses: $/.github/workflows/reusable-deploy.yaml
    with:
      stageName: prd
      stack: all
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
