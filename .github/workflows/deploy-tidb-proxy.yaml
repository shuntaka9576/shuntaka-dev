name: Deploy tidb-proxy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'デプロイする commit SHA / タグ（空なら実行ブランチの HEAD）'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: deploy-tidb-proxy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy (ecspresso)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    # AWS_ACCOUNT_ID は dev environment のシークレットのため environment 指定が必須
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          # tidb-proxy は dev/prd 共用スタックのため dev ロール固定
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-shuntaka-assume-role
          aws-region: ap-northeast-1

      - name: Install ecspresso
        uses: kayac/ecspresso@v2.8.5
        with:
          version: v2.6.0

      - name: Deploy tidb-proxy
        run: ./scripts/deploy-tidb-proxy.sh
