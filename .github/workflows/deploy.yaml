name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stageName:
        description: 'Deploy stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prd
      stack:
        description: 'Deploy stack (all = st-tidb-proxy -> st-tidb-proxy-logs -> main -> admin の順で全部)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - st-tidb-proxy
          - st-tidb-proxy-logs
          - main
          - admin

permissions: {}

concurrency:
  group: deploy-${{ inputs.stageName || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      id-token: write # AWS IAM Role に OIDC AssumeRole するため reusable workflow に継承
      contents: read
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      # main push は dev 固定。prd はタグリリース (tagpr.yaml) か手動 dispatch で行う
      stageName: ${{ inputs.stageName || 'dev' }}
      # push トリガでは inputs が空なので all (従来挙動) になる
      stack: ${{ inputs.stack || 'all' }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
