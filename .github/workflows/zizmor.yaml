name: zizmor audit

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF を GitHub Code Scanning にアップロードするため
      contents: read # actions/checkout でリポジトリを取得するため
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run zizmor
        # Latest stable zizmor (1.31.1) flags tag refs. Lockfile support
        # starts at 1.32.0-rc1, so pin that until a stable release exists.
        run: uvx --from zizmor==1.32.0rc1 zizmor --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: results.sarif
          category: zizmor
