name: CI

on: [push]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Lint
        shell: bash
        run: pnpm lint

      - name: Spell check
        shell: bash
        run: pnpm spell-check

      - name: Type check
        shell: bash
        run: pnpm type-check

      - name: Test
        shell: bash
        run: pnpm run test
