name: Renovate Cargo Update

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'apps/blog-api/**/Cargo.toml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-and-ci:
    name: Update Cargo.lock
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # GITHUB_TOKEN で push すると後続ワークフローがトリガーされない仕様を回避するため、
      # GitHub App トークンを発行してそれで push する
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SHUNTAKA_DEV_UTILS_APP_ID }}
          private-key: ${{ secrets.SHUNTAKA_DEV_UTILS_PRIVATE_KEY }}
          repositories: |
            shuntaka-dev
          permission-contents: write

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Update Cargo.lock
        run: cargo update

      - name: Run CI
        uses: ./.github/actions/ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Commit Cargo.lock
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update Cargo.lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
