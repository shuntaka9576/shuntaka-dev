name: Renovate Cargo Update

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'apps/blog-api/**/Cargo.toml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update-and-ci:
    name: Update Cargo.lock
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Cargo.lock の更新コミットを PR ブランチへ push するため
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Update Cargo.lock
        run: cargo update

      - name: Run CI
        uses: ./.github/actions/ci

      - name: Commit Cargo.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore: update Cargo.lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
