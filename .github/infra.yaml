apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: shuntaka-dev
  owner: shuntaka9576
reconcile:
  labels: authoritative
spec:
  description: https://shuntaka.dev blog source
  homepage: https://shuntaka.dev
  visibility: public
  archived: false
  labels:
    - name: bug
      description: Something isn't working
      color: d73a4a
  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: true
    allow_squash_merge: true
    allow_rebase_merge: true
    allow_auto_merge: false
    auto_delete_head_branches: true
    squash_merge_commit_title: COMMIT_OR_PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: false
  security:
    vulnerability_alerts: true
    automated_security_fixes: false
    private_vulnerability_reporting: true
  rulesets:
    - name: protect
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - refs/heads/main
      rules:
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false
    - name: protect-main
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
      rules:
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: false
    workflow_permissions: read
    can_approve_pull_requests: true
    fork_pr_approval: all_external_contributors
