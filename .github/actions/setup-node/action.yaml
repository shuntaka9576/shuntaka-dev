name: Setup node
description: Setup Node and restore cache

inputs:
  use-cache:
    description: 'Whether to use GitHub Actions cache for node_modules'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Tag refs stay in this file. The commits are recorded in
    # .github/workflows/actions.lock. zizmor does not apply that file to
    # action.yml yet: https://docs.zizmor.sh/usage/#workflow-lockfiles
    - uses: actions/setup-node@v7.0.0 # zizmor: ignore[unpinned-uses]
      with:
        node-version-file: './.node-version'
        package-manager-cache: false

    - uses: oven-sh/setup-bun@v2.2.0 # zizmor: ignore[unpinned-uses]
      with:
        bun-version-file: '.bun-version'

    - name: Cache node_modules
      if: inputs.use-cache == 'true'
      id: cache-node-modules
      uses: actions/cache@v6.1.0 # zizmor: ignore[unpinned-uses]
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('bun.lockb') }}

    - name: Install node modules
      if: inputs.use-cache != 'true' || steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
