env_files = ["./.env.local"]

[config]
default_to_workspace = false

[env]
PORT = { script = ["echo ${API_PORT:-8080}"] }
AWS_REGION = "ap-northeast-1"

[env.development]
# Tailnet 名は環境ごとに変わるため、tailscale CLI から動的取得して URL を組み立てる。
# 取り込み先 database は dsql-cli の dsl-tidb で作成した `blog_dev` を既定値とする。
# DATABASE_URL を外から渡した場合はそれを優先する（ローカル Docker TiDB の blog_test 等に
# 向けたいとき: DATABASE_URL=mysql://root@127.0.0.1:4100/blog_test bun run dev）
DATABASE_URL = { script = [
  "if [ -n \"${DATABASE_URL:-}\" ]; then echo \"$DATABASE_URL\"; else TAILNET=$(tailscale status --json | jq -r .MagicDNSSuffix); echo \"mysql://root@tidb.${TAILNET}:4000/${TIDB_DATABASE:-blog_dev}\"; fi",
] }
[tasks.run]
command = "cargo"
args = ["watch", "-x", "run"]

[tasks.build]
command = "cargo"
args = ["build", "${@}"]

[tasks.check]
command = "cargo"
args = ["check"]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all", "${@}"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--all", "--all-targets", "${@}"]
