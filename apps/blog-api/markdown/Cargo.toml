[package]
name = "markdown"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib は wasm-pack (tools/content-html-backfill) 用。rlib は blog-api からの通常利用
crate-type = ["cdylib", "rlib"]

[dependencies]
comrak = { version = "0.54.0", default-features = false, features = ["syntect"] }
regex = "1.13.0"
scraper = "0.27.0"
url = "2.5.8"
serde_json = "1.0.150"

# native は同期 HTTP (ureq) + onig 版 syntect (comrak の native 指定と同じ)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.3.0", features = ["rustls"] }
syntect = "5.3.0"

# wasm32 は onig (C依存) が使えないため fancy-regex 版 syntect (comrak の wasm 指定と同じ)。
# HTTP フェッチは JS 側で事前に行い、MapResourceFetcher で注入する
[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6.5"
