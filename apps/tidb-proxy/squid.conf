# tidb-proxy squid configuration
#
# CONNECT method を 443 のみ許可し、destination は narrow whitelist で絞る。
# `.amazonaws.com` ワイルドカードは廃止し具体的な FQDN のみ列挙する。

# ---- listen ----
http_port 3128
visible_hostname tidb-proxy

# squid 6.x は root run を明示拒否するため default の "squid" user に drop する。
# container の /dev/stdout / /dev/stderr は root 所有なので entrypoint.sh で
# chmod 666 して squid user から fopen できるようにしている。

# ---- ACL definitions ----
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 127.0.0.0/8
acl localnet src ::1/128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Lambda アプリが実際に呼ぶ FQDN のみ列挙する。新規利用時は ACL を更新すること。
acl allowed_dst dstdomain api.github.com
acl allowed_dst dstdomain api.tailscale.com
acl allowed_dst dstdomain ssm.ap-northeast-1.amazonaws.com
acl allowed_dst dstdomain kms.ap-northeast-1.amazonaws.com
acl allowed_dst dstdomain logs.ap-northeast-1.amazonaws.com

# ---- access rules ----
# 不正な CONNECT は早期に拒否
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# localhost 自体への管理操作は許可しない
http_access deny manager

# 内部 LAN から、SSL_ports + allowed_dst の CONNECT のみ許可
http_access allow localnet CONNECT SSL_ports allowed_dst

# それ以外はすべて拒否
http_access deny all

# ---- misc ----
# キャッシュは無効化 (forward proxy 用途のため不要)
cache deny all

# stdout/stderr を docker logs / awslogs driver に流す
# squid 6.x: access_log は stdio:/path モジュール表記 + logformat= が必要、
# cache_log は素のファイルパスのみで stdio: プレフィックスは付けられない。
access_log stdio:/dev/stdout logformat=combined
cache_log /dev/stderr

# tail process を立てない
logfile_rotate 0
