# tidb-proxy squid configuration
#
# 個人ブログ用途のため destination whitelist は持たない。VPC 内 (localnet) から
# CONNECT 443 のみを通し、外部公開はゼロ (proxy 自体が VPC 内 ENI 経由のみ到達可)。
# 攻撃面が「Lambda RCE → C2」「悪性 crate の phone-home」だけになるが、本ブログの
# 脅威モデルでは許容。記事レンダ時の link-card / GitHub blob embed が壊れない方が
# 運用上のメリットが上回る。

http_port 3128
visible_hostname tidb-proxy

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 127.0.0.0/8
acl localnet src ::1/128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager

http_access allow localnet CONNECT SSL_ports
http_access deny all

cache deny all

# アクセスログは FireLens (Fluent Bit) が JSON としてパースし、Firehose 経由で
# Iceberg テーブル (tidb_proxy_logs.logs) へ流すため、キー名をテーブルスキーマに
# 合わせた 1 行 JSON で出力する。
#   - %{...}tg: GMT 時刻 (strftime 書式)。コンテナ TZ に依存せず UTC 固定になる
#   - %"{User-Agent}>h: encoding flag `"` で quote / backslash を \-エスケープ
#   - %ru: CONNECT 専用 proxy のため実質 host:port 形式 (quote 混入の余地なし)
#   - 欠損ヘッダ等が "-" になり数値フィールドが壊れた行は、Fluent Bit の JSON
#     パース失敗として CloudWatch Logs へフォールバックするだけなので許容
logformat json_access {"ts":"%{%Y-%m-%dT%H:%M:%SZ}tg","log_type":"squid_access","level":"INFO","client_ip":"%>a","method":"%rm","url":"%ru","http_version":"%rv","status":%>Hs,"bytes_in":%>st,"bytes_out":%<st,"duration_ms":%tr,"user_agent":"%"{User-Agent}>h","squid_status":"%Ss","hier_status":"%Sh"}

# squid 6.x: access_log は stdio:/path モジュール表記 + logformat= が必要、
# cache_log は素のファイルパスのみで stdio: プレフィックスは付けられない。
# cache_log (非 JSON) は Fluent Bit のフォールバックで CloudWatch Logs 行き。
access_log stdio:/dev/stdout logformat=json_access
cache_log /dev/stderr

logfile_rotate 0
