# tidb-proxy squid configuration
#
# 個人ブログ用途のため destination whitelist は持たない。VPC 内 (localnet) から
# CONNECT 443 のみを通し、外部公開はゼロ (proxy 自体が VPC 内 ENI 経由のみ到達可)。
# 攻撃面が「Lambda RCE → C2」「悪性 crate の phone-home」だけになるが、本ブログの
# 脅威モデルでは許容。記事レンダ時の link-card / GitHub blob embed が壊れない方が
# 運用上のメリットが上回る。

http_port 3128
visible_hostname tidb-proxy

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 127.0.0.0/8
acl localnet src ::1/128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager

http_access allow localnet CONNECT SSL_ports
http_access deny all

cache deny all

# squid 6.x: access_log は stdio:/path モジュール表記 + logformat= が必要、
# cache_log は素のファイルパスのみで stdio: プレフィックスは付けられない。
access_log stdio:/dev/stdout logformat=combined
cache_log /dev/stderr

logfile_rotate 0
