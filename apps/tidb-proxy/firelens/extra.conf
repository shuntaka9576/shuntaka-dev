# tidb-proxy の FireLens (Fluent Bit) ルーティング設定。
#
# FireLens が自動生成する INPUT (tag: tidb-proxy-firelens-<taskID>) を受けて、
#   - JSON パース成功 + level=WARN/ERROR/FATAL → CloudWatch Logs (障害調査用)
#   - JSON パース成功 + level=INFO/DEBUG      → Firehose → Iceberg (Athena で検索)
#   - JSON パース失敗 (tsnet 内部ログ / squid cache_log / 壊れた行)
#                                             → CloudWatch Logs へフォールバック
# に振り分ける。設計の全体像は
# docs/source/98_tasks/2026-07-10-tidb-proxy-log-iceberg/index.md を参照。
#
# ${AWS_REGION} / ${CW_LOG_GROUP_NAME} / ${FIREHOSE_DELIVERY_STREAM} は
# ecs-task-def.jsonnet の log-router コンテナ environment から渡される。
#
# 注意: この設定は init プロセスがコンテナ起動時に一度だけ S3 から取得する。
# 変更を反映するには S3 更新 (cdk deploy st-tidb-proxy-logs) 後に
# `aws ecs update-service --force-new-deployment` が必要。

# tidb-proxy コンテナの stdout/stderr 行 (record の `log` キー) を JSON パース。
# 成功時は `log` キーが展開後のフィールドに置き換わり、失敗時は record が
# そのまま残る (= level キーが無いので rewrite_tag に拾われず fallback へ)。
[FILTER]
    Name         parser
    Match        tidb-proxy-firelens*
    Key_Name     log
    Parser       tidb_proxy_json
    Reserve_Data On

[FILTER]
    Name         rewrite_tag
    Match        tidb-proxy-firelens*
    Rule         $level ^(WARN|ERROR|FATAL)$ cwlogs.$TAG false
    Rule         $level ^(INFO|DEBUG)$ firehose.$TAG false
    Emitter_Name log_router_emitter

# Firehose → Iceberg 行きは Glue テーブル (tidb_proxy_logs.logs) のスキーマに
# 存在するカラムだけに絞る。FireLens が付与する ECS メタデータ (ecs_cluster,
# container_id 等) や slog の任意属性がスキーマ外フィールドとして配信エラーに
# なるのを防ぐ。
[FILTER]
    Name          record_modifier
    Match         firehose.*
    Allowlist_key ts
    Allowlist_key log_type
    Allowlist_key level
    Allowlist_key message
    Allowlist_key client_ip
    Allowlist_key method
    Allowlist_key url
    Allowlist_key http_version
    Allowlist_key status
    Allowlist_key bytes_in
    Allowlist_key bytes_out
    Allowlist_key duration_ms
    Allowlist_key user_agent
    Allowlist_key squid_status
    Allowlist_key hier_status

# JSON パース失敗行のフォールバック。log_key で生の行だけを送る (JSON ラッパー
# を剥がして従来の awslogs 時代と同じ見た目にする)。
[OUTPUT]
    Name              cloudwatch_logs
    Match             tidb-proxy-firelens*
    region            ${AWS_REGION}
    log_group_name    ${CW_LOG_GROUP_NAME}
    log_stream_prefix fluentbit-fallback-
    log_key           log
    auto_create_group false

# WARN/ERROR/FATAL は構造化 JSON のまま CloudWatch Logs へ。
[OUTPUT]
    Name              cloudwatch_logs
    Match             cwlogs.*
    region            ${AWS_REGION}
    log_group_name    ${CW_LOG_GROUP_NAME}
    log_stream_prefix fluentbit-warnerr-
    auto_create_group false

# INFO 系は Firehose 経由で Iceberg へ。
# Retry_Limit 2: Firehose 長時間障害時にチャンクを溜め込んでタスクメモリ (512MB)
# を圧迫しないよう、リトライ 2 回で破棄する (アクセスログの欠損は許容)。
# FireLens 自動生成の INPUT には mem_buf_limit を注入できないため、メモリ上限は
# この Retry_Limit で担保する。
[OUTPUT]
    Name            kinesis_firehose
    Match           firehose.*
    region          ${AWS_REGION}
    delivery_stream ${FIREHOSE_DELIVERY_STREAM}
    Retry_Limit     2
