# tidb-proxy コンテナ (squid + forwarder) の 1 行 JSON ログ用パーサー。
# aws-for-fluent-bit の init プロセスは [PARSER] セクションを含むファイルを
# parsers_file として自動登録する。
#
# Time_Key は意図的に設定しない。forwarder (slog, ナノ秒 RFC3339) と squid
# (秒精度 ISO8601) で時刻フォーマットが異なり、パース失敗時の挙動が紛らわしい
# ため、`ts` はデータフィールドのまま Iceberg / CloudWatch に渡す。
[PARSER]
    Name   tidb_proxy_json
    Format json
