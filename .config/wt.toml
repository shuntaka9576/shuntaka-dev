# Parallel worktree support: unique ports per worktree via hash_port

[pre-start]
env = """
cat > .env.local <<'ENVEOF'
WEB_PORT={{ ('web-' ~ branch) | hash_port }}
API_PORT={{ ('api-' ~ branch) | hash_port }}
NEXT_PUBLIC_SITE_URL=http://localhost:{{ ('web-' ~ branch) | hash_port }}
NEXT_PUBLIC_API_URL=http://localhost:{{ ('api-' ~ branch) | hash_port }}
PORT={{ ('api-' ~ branch) | hash_port }}
DOCS_PORT={{ ('docs-' ~ branch) | hash_port }}
ADMIN_API_PORT={{ ('admin-api-' ~ branch) | hash_port }}
ADMIN_WEB_PORT={{ ('admin-web-' ~ branch) | hash_port }}
ORIGIN_ALLOWLIST=http://localhost:{{ ('admin-web-' ~ branch) | hash_port }}
STORYBOOK_PORT={{ ('storybook-' ~ branch) | hash_port }}
LABS_WEB_PORT={{ ('labs-web-' ~ branch) | hash_port }}
LABS_API_PORT={{ ('labs-api-' ~ branch) | hash_port }}
ENVEOF
"""
envrc = "direnv allow ."
copy = "wt step copy-ignored"
install = "bun install"

[post-remove]
kill-web = "lsof -ti :{{ ('web-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"
kill-api = "lsof -ti :{{ ('api-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"
kill-admin-api = "lsof -ti :{{ ('admin-api-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"
kill-admin-web = "lsof -ti :{{ ('admin-web-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"
kill-storybook = "lsof -ti :{{ ('storybook-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"
kill-labs-web = "lsof -ti :{{ ('labs-web-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"
kill-labs-api = "lsof -ti :{{ ('labs-api-' ~ branch) | hash_port }} -sTCP:LISTEN | xargs kill 2>/dev/null || true"

[list]
url = "http://localhost:{{ ('web-' ~ branch) | hash_port }}"
