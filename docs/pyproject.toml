[project]
name = "docs"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14.6"
dependencies = [
  "myst-parser>=5.1.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-last-updated-by-git>=0.3.8",
  "sphinx-rtd-theme>=3.1.0",
  "sphinx>=9.1.0",
  "sphinxcontrib-mermaid>=2.0.3",
]

[dependency-groups]
dev = ["ruff>=0.15.22", "sphinx-autobuild>=2025.8.25"]

[tool.uv]
override-dependencies = ["sphinx>=9.0.4"]

# docs は Sphinx ドキュメント用プロジェクトで Python パッケージではないため、
# setuptools のパッケージ自動検出（source / node_modules を誤検出する）を無効化する。
[tool.setuptools]
py-modules = []
