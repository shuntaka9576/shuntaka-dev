# TiDB (MySQL互換) の blog_dev スキーマからドキュメントを生成する
# 実行例:
#   export TAILNET=$(tailscale status --json | jq -r '.MagicDNSSuffix')
#   cd docs && TBLS_DSN="mysql://root@tidb.$TAILNET:4000/blog_dev" tbls doc -c .tbls.yaml --rm-dist
dsn: ${TBLS_DSN}

comments:
  - table: articles
    columnComments:
      status: '記事のステータス: draft(下書き), review(レビュー待ち), scheduled(公開予約), published(公開済み), archived(アーカイブ済み)'

docPath: source/01_開発ドキュメント/05_db
er:
  format: mermaid
  showColumnTypes:
    related: true
    primary: true
relations:
  - table: articles
    columns:
      - user_id
    parentTable: users
    parentColumns:
      - user_id
  - table: moments
    columns:
      - user_id
    parentTable: users
    parentColumns:
      - user_id
  - table: articles_tags
    columns:
      - article_id
    parentTable: articles
    parentColumns:
      - article_id
  - table: articles_tags
    columns:
      - tag_id
    parentTable: tags
    parentColumns:
      - tag_id
  - table: tag_article_counts
    columns:
      - user_id
    parentTable: users
    parentColumns:
      - user_id
  - table: tag_article_counts
    columns:
      - tag_id
    parentTable: tags
    parentColumns:
      - tag_id
